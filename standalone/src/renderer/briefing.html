<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: plaintorch-media:; font-src 'self' data:">
	<title>PLAINTORCH Briefing</title>
	<style>
		#briefing {
			box-sizing: border-box;
			height: 100vh;
			padding: 0.2em 1em 1.4em;
			overflow: auto;
		}

		.waiting {
			display: grid;
			place-content: center;
			justify-items: center;
			gap: 14px;
			height: 100%;
			text-align: center;
		}

		.waiting .glyph {
			width: 72px;
			height: 72px;
			color: var(--p7t-accent-soft);
		}

		.waiting .message {
			max-width: 440px;
			color: var(--text-muted);
			white-space: pre-wrap;
		}

		.waiting .actions {
			display: flex;
			gap: 8px;
		}
	</style>
</head>
<body>
	<div id="briefing" class="plaintorch-briefing-view plaintorch-root"></div>
	<script src="./briefing.js"></script>
</body>
</html>
